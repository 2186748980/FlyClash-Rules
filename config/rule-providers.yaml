# FlyClash / Mihomo 远程 Rule Provider
#
# 这些规则直接引用 MetaCubeX meta-rules-dat 的 MRS 数据，按 interval 自动更新。
# 不包含任何节点、机场订阅、账号或密钥。
#
# 用法：把 rule-providers: 部分合并到自己的 Mihomo 配置，
# 再把 config/rules-provider-rules.yaml 中的 rules: 合并进去。

rule-anchor:
  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

rule-providers:
  ads:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"

  private:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"

